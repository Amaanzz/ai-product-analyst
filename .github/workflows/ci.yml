# CI: lints the codebase, runs the full synthetic-data pipeline (so a broken
# generator/ETL/SQL step fails the build, not just unit tests in isolation),
# then runs the pytest suite.
#
# NOT YET RUN: this workflow was authored without access to GitHub's runners
# (no internet in the build sandbox) and has never actually executed. The
# steps mirror exactly what was verified manually in that sandbox (see
# README.md Section 4), so it should work, but confirm on your first push.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint (flake8, errors only -- style nitpicks don't fail the build)
        run: |
          flake8 src api dashboard --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run the data pipeline (generator -> ETL -> SQL layer)
        run: |
          python src/ingestion/generate_synthetic_data.py --n-users 3000 --seed 42
          python src/preprocessing/etl.py
          python src/sql_layer/load_to_sqlite.py
          python src/sql_layer/run_queries.py

      - name: Run test suite
        run: |
          pytest tests/ -v

      - name: Compile-check the FastAPI app and Streamlit dashboard
        run: |
          python -m py_compile api/main.py
          python -m py_compile dashboard/app.py
